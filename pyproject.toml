[project]
name = "snitch-engine"
version = "0.1.0"
description = "Integrity layer for AI coding agents: detects test cheating."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0",
    "structlog>=26.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.3",
]

[project.scripts]
snitch = "engine.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
extend-exclude = ["tests/fixtures"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
